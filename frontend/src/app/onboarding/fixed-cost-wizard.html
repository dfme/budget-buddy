<section class="wizard">
  <h1>Budget</h1>
  <!--
    FE-FC-09: «Budget» statt «Fixkosten erfassen» — seit die Einkommens-Card hier eingebettet
    ist, sind Einkommen und Fixkosten zwei gleichrangige Abschnitte auf derselben Seite, keiner
    ist mehr der alleinige Titel. Der Hinweis auf «Budget» als späteren Bearbeitungsort schliesst
    den Kreis zur Seite gleichen Namens (/budget, FE-FC-09).
  -->
  <p class="lead">
    Einkommen und Fixkosten erfassen — beide bilden die Grundlage für deinen Safe-to-Spend-Betrag.
    Du kannst sie später jederzeit unter «Budget» anpassen.
  </p>

  <!--
    FE-FC-09: derselbe eingebettete Abschnitt «Einkommen» wie auf der Budget-Seite
    (onboarding/fixed-cost-list.html) — beide Werte fliessen in den Safe-to-Spend ein, und
    wer sie schon beim ersten Einrichten kennt, sieht nicht erst nach dem Onboarding einen
    Hinweis auf fehlendes Einkommen. Optional wie überall: leer lassen und der Abschluss unten
    schliesst das Onboarding trotzdem ab.
  -->
  <app-income-card (saved)="fixedCosts.reload()" />

  <!--
    FE-FC-13: derselbe Fixkosten-Abschnitt wie auf /budget — Tabelle mit Total, Bearbeiten,
    Löschen und «+ Neue Position», die den Dialog öffnet. Bis dahin stand hier ein eigenes
    Inline-Formular, das nach jedem Speichern leer war: wer mehrere Positionen am Stück erfasste,
    sah nirgends, was schon gespeichert war. Eigene Zwischenüberschrift «Fixkosten» als h2,
    analog «Einkommen» — hier gibt es keine Gruppe «Ausgaben» darüber. Speichert die
    Einkommens-Card, lädt der Abschnitt neu: die Warnung «Fixkosten übersteigen Einkommen» hängt
    an seinem Request.
  -->
  <app-fixed-cost-section #fixedCosts heading="Fixkosten" [headingLevel]="2" />

  <!-- Abgesetzt unter dem Fixkosten-Abschnitt: der Abschluss verlässt den Wizard und gehört
       nicht in dieselbe Fläche wie die Erfassung. -->
  <div class="wizard__finish">
    @if (completeError(); as message) {
      <app-notice variant="error">{{ message }}</app-notice>
    }

    <button
      appButton
      block
      variant="ghost"
      type="button"
      [disabled]="completing()"
      (click)="finishOnboarding()"
    >
      @if (completing()) {
        Wird abgeschlossen…
      } @else if (hasEnteredData()) {
        Fertig — weiter zum Dashboard
      } @else {
        Später erfassen — weiter zum Dashboard
      }
    </button>
  </div>
</section>
