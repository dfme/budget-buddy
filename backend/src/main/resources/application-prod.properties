# --- Produktions-Profil (Render, Docker) ---
# Aktiviert via SPRING_PROFILES_ACTIVE=prod (siehe render.yaml).
# Überschreibt nur die produktionsrelevanten Werte; der Rest wird aus
# application.properties geerbt.

# --- DataSource: Neon PostgreSQL (DB-05, ADR-12) ---
# Hier stehen bewusst KEINE Werte. Die Verbindung kommt vollständig aus der
# Render-Umgebung, gesetzt im Render-Dashboard (in render.yaml nur mit sync: false
# deklariert, damit kein Credential im Repo landet — CLAUDE.md, "Keine Secrets im Git"):
#
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<host>.eu-central-1.aws.neon.tech/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME  <neon-user>
#   SPRING_DATASOURCE_PASSWORD  <neon-passwort>
#
# Spring bindet diese drei Namen direkt auf spring.datasource.* und überschreibt damit
# die lokalen Defaults aus application.properties. Fehlen sie, startet die App gegen
# localhost und scheitert an der Verbindung — ein lauter Fehler, kein stiller Fallback
# auf eine falsche Datenbank.
#
# sslmode=require ist Pflicht: Neon nimmt ausschliesslich TLS-Verbindungen an.
#
# Neon skaliert den Compute nach 5 Min Inaktivität auf null und fährt bei der nächsten
# Verbindung automatisch wieder hoch (Free-Plan). Der erste Request danach kostet
# Latenz — die Daten überleben es, anders als beim vorherigen SQLite-Stand.

# --- Connection Pool (INFRA-28) ---
# Ohne diese Werte laufen HikariCP-Defaults: minimumIdle = maximumPoolSize = 10, maxLifetime
# 30 Min. Der Pool hält dann dauerhaft zehn offene Verbindungen und ersetzt jede davon nach
# maxLifetime durch eine neue — dieser Neuaufbau weckt Neons Compute alle 30 Minuten auf.
#
# minimum-idle=0 (nicht 1): Jede gehaltene Verbindung ist eine, die rotiert wird. Nur ein Pool,
# der im Leerlauf auf null schrumpft, ist wirklich still. Der Fail-Fast beim Start bleibt davon
# unberührt — HikariCP öffnet auch bei minimumIdle=0 eine Prüfverbindung und schliesst sie
# sofort wieder; falsche Credentials lassen die App weiterhin laut scheitern.
#
# Preis: Der erste Request nach einer Leerlaufphase zahlt den Verbindungsaufbau (TLS-Handshake
# + Auth). Das fällt gegen Neon ohnehin an, sobald der Compute suspendiert war.
#
# maximum-pool-size bleibt beim Default 10: Es beeinflusst den Compute-Verbrauch nicht, und
# Neons Verbindungslimit bei 0.25 CU liegt weit darüber.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# --- Server ---
# Render gibt den zu bindenden Port über die Umgebungsvariable PORT vor.
server.port=${PORT:8080}

# --- CORS ---
# In Produktion liefern SPA und API denselben Origin aus (SPA gebündelt im JAR),
# daher ist kein CORS nötig (vgl. ADR-0 / ADR-10). Es wird bewusst keine
# CORS-Mapping-Konfiguration aktiviert.

# --- Auth-Cookie (BE-AUTH-03) ---
# Produktion läuft über HTTPS: jwt-Cookie nur über sichere Verbindungen senden.
app.cookie.secure=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.budgetbuddy=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
