spring.application.name=budgetbuddy

# --- PostgreSQL DataSource (DB-05, ADR-12) ---
# Defaults zeigen auf den lokalen Container aus docker-compose.yml im Repo-Root.
# Jeder Teil ist per Umgebungsvariable überschreibbar; in Produktion setzt Render
# stattdessen direkt SPRING_DATASOURCE_URL/_USERNAME/_PASSWORD (siehe
# application-prod.properties) — Spring bindet diese Namen ohne Zutun hier.
#
# Die Zugangsdaten unten sind bewusst keine Secrets im Sinne von CLAUDE.md: sie gelten
# ausschliesslich für den Wegwerf-Container auf localhost und in keiner Umgebung, die
# echte Daten hält (gleiche Begründung wie beim E2E-Test-Secret in e2e/support/backend.ts).
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:budgetbuddy}
spring.datasource.username=${POSTGRES_USER:budgetbuddy}
spring.datasource.password=${POSTGRES_PASSWORD:budgetbuddy}

# --- JPA / Hibernate ---
# Schema wird von Flyway verwaltet (ab DB-01), nicht von Hibernate.
# Keine dialect-Property: Hibernate erkennt PostgreSQL über die JDBC-Metadaten selbst.
# Nur SQLite brauchte hier eine explizite Angabe samt hibernate-community-dialects.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway ---
# Startup-Migration aktiviert (DB-01). Schema wird ausschliesslich von Flyway verwaltet.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Actuator ---
# health: Gesamtstatus inkl. Datenbank — für Menschen und den CD-Smoke-Test. NICHT der Pfad,
# den Render pingt (siehe Liveness-Probe unten).
# info: meldet den ausgeführten Commit, damit der CD-Smoke-Test die deployte Version
# verifizieren kann statt nur "irgendeine Instanz antwortet" (INFRA-08).
management.endpoints.web.exposure.include=health,info

# Liveness-Probe unter /actuator/health/liveness (INFRA-28). Sie enthält ausschliesslich den
# livenessState und damit — anders als /actuator/health — keinen DataSourceHealthIndicator,
# der pro Aufruf ein SELECT 1 gegen die Datenbank absetzt.
#
# Render pingt diesen Pfad im Dauerbetrieb (render.yaml healthCheckPath). Mit dem DB-behafteten
# /actuator/health hielt dieser Ping Neons Compute rund um die Uhr wach: Scale-to-Zero griff nie,
# und der Verbrauch lag bei ~6 CU-h pro Tag des 100-CU-h-Monatskontingents. Sichtbar wurde es
# erst, als INFRA-24 den Render-Spin-Down abschaffte — davor verdeckte der schlafende Service
# das Problem.
#
# Inhaltlich ist die Liveness-Probe auch das richtigere Signal: Der Container-Neustart, den
# Render bei rotem Health-Check auslöst, repariert eine Neon-Störung nicht.
#
# Der Pfad muss in SecurityConfig.PUBLIC_PATHS stehen, sonst antwortet er mit 401.
management.endpoint.health.probes.enabled=true

# Der env-Info-Contributor ist seit Spring Boot 2.6 standardmässig aus; er exponiert
# ausschliesslich Properties unter info.* — kein Env-Dump.
management.info.env.enabled=true

# RENDER_GIT_COMMIT setzt Render automatisch auf den deployten Commit-SHA
# (https://render.com/docs/environment-variables). Ausserhalb von Render (lokal, Tests,
# CI) fehlt die Variable → "unknown". Der CD-Smoke-Test vergleicht diesen Wert mit dem
# GITHUB_SHA des Runs: "unknown" matcht nie, der Job wird also rot statt falsch grün.
info.app.commit=${RENDER_GIT_COMMIT:unknown}

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Secrets (ausschliesslich via Umgebungsvariablen, niemals hardcodiert) ---
# Leer-Default: fehlt JWT_SECRET, schlägt die @NotBlank-Validierung in JwtProperties
# beim Start fehl (Fail-fast) statt einen unsicheren Default zu verwenden.
app.jwt.secret=${JWT_SECRET:}
anthropic.api.key=${ANTHROPIC_API_KEY:}

# --- Kategorisierung via Claude (BE-CAT-02) ---
# Schnelles, günstiges Modell für Single-Label-Klassifikation. Überschreibbar via
# ANTHROPIC_API_MODEL, z.B. um ohne Redeploy auf ein neueres Modell zu wechseln.
# Fehlt der ANTHROPIC_API_KEY, startet die App trotzdem — unbekannte Transaktionen
# werden dann als "Sonstiges" eingestuft (kein Fail-fast, anders als bei JWT_SECRET).
anthropic.api.model=${ANTHROPIC_API_MODEL:claude-haiku-4-5}

# Preis des Modells in USD pro 1 Mio. Tokens — ausschliesslich für das Kosten-Logging (BE-CAT-09).
# Die API liefert in ihrer Antwort keinen Geldbetrag, nur Token-Zähler; der Preis ist deshalb eine
# Fremdannahme und steht hier statt im Code, damit eine Preisänderung kein Deployment braucht.
# Stand 02.09.2026, Quelle: https://platform.claude.com/docs/en/about-claude/pricing
# Fehlt der Eintrag zum verwendeten Modell, loggt die App nur die Tokens und keine Kosten —
# eine Zeile ohne Zahl ist brauchbar, eine mit veralteter Zahl nicht.
anthropic.api.pricing[claude-haiku-4-5].input-per-mtok=1.00
anthropic.api.pricing[claude-haiku-4-5].output-per-mtok=5.00

# Startup-Healthcheck der Anthropic-API (INFRA-11): setzt nach ApplicationReadyEvent einmalig
# einen kostenlosen GET /v1/models ab, um einen vertippten oder widerrufenen Key sofort zu
# melden statt erst beim ersten Import. In Produktion immer an.
# Der Schalter existiert für die Testausführung: AnthropicStartupHealthCheck ist die einzige
# Komponente, die beim Hochfahren eines Kontexts von sich aus ins Netz geht. pom.xml setzt ihn
# für alle Tests auf false (BE-CAT-07, #162) — Begründung dort.
budgetbuddy.anthropic.startup-healthcheck.enabled=true

# Fail-fast-Prüfung von spring.datasource.url im prod-Profil (INFRA-25), siehe
# DataSourceUrlEnvironmentPostProcessor. In Produktion immer an; pom.xml setzt ihn für alle Tests
# auf false, weil ProdProfileSmokeTest das prod-Profil bewusst gegen einen Testcontainers-Postgres
# auf localhost bootet und zum Zeitpunkt des EnvironmentPostProcessor noch der Localhost-Default
# steht, nicht die per @DynamicPropertySource erst später registrierte Testcontainers-URL.
budgetbuddy.datasource.url-failfast.enabled=true

# --- PDF-Import (BE-PDF-02, seit ADR-14 zweigeteilt) ---
# Zeitbudget des SYNCHRONEN Teils, also nur noch des Parsens. PDFBox kennt kein eigenes
# Timeout; ohne diesen Wert könnte ein pathologisches PDF den Request beliebig lange binden.
# Überschritten -> 408, und weil noch kein Job existiert, ist auch nichts halb angefangen.
budgetbuddy.import.timeout-seconds=30

# Watchdog des ASYNCHRONEN Teils (Kategorisierung im ImportJobRunner). Auf ihn wartet kein
# Request mehr, der Wert darf deshalb grosszügig sein — er verhindert nur, dass ein hängender
# Claude-Call einen Worker-Thread unbegrenzt bindet. Überschritten wird NICHT abgebrochen:
# Der Rest fällt ohne Claude-Call auf "Sonstiges" und der Import wird vollständig gespeichert
# (#192: der alte Zustand verwarf nach 30s alle 108 Transaktionen).
budgetbuddy.import.categorization-timeout-seconds=300

# Transaktionen pro Claude-Call (ADR-14, Option A). Die Laufzeit eines Calls steckt fast
# vollständig im Fixkostenanteil pro Request, nicht in der Generierung — 41 Einzelcalls kosteten
# ~47s, drei Bündel kosten wenige Sekunden. Der Wert ist zugleich die Auflösung der
# Fortschrittsanzeige: processed wächst pro abgeschlossenem Bündel.
budgetbuddy.import.batch-size=20

# --- PDF-Upload-Limit (BE-PDF-03) ---
# Serverseitige 10-MB-Grenze für die eigentliche PDF-Datei. Überschritten -> Spring wirft
# MaxUploadSizeExceededException, die der PdfImportExceptionHandler auf 413 abbildet.
spring.servlet.multipart.max-file-size=10MB
# request-size bewusst etwas höher als file-size: Der Multipart-Rahmen (Boundary, Part-Header)
# addiert einige hundert Byte, die sonst eine Datei exakt an der 10-MB-Grenze über die
# request-size treiben und fälschlich mit 413 ablehnen würden. 11 MB gibt reichlich Luft, ohne
# die effektive Dateigrenze aufzuweichen (die bleibt max-file-size).
spring.servlet.multipart.max-request-size=11MB
# Lazy: Der Multipart-Body wird erst beim Argument-Binding im Controller geparst, nicht schon in
# DispatcherServlet.checkMultipart. Damit entsteht die MaxUploadSizeExceededException innerhalb
# des bereits aufgelösten Handlers, sodass der Controller-scoped PdfImportExceptionHandler sie auf
# 413 abbilden kann; bei eager Parsing wäre der Handler noch nicht bekannt und der Fehler würde
# als 500 durchschlagen.
spring.servlet.multipart.resolve-lazily=true

# --- JWT (BE-AUTH-01) ---
# Gültigkeitsdauer der Tokens (Spring-Duration-Format, z.B. 24h, 30m).
app.jwt.expiration=24h

# --- Auth-Cookie (BE-AUTH-03) ---
# Secure-Flag des jwt-Cookies. Default false für Dev (HTTP localhost); in Produktion
# via application-prod.properties auf true gesetzt (HTTPS erzwungen).
app.cookie.secure=false

# --- Logging-Kontext (INFRA-37) ---
# Hängt Request- und User-ID aus dem MDC an jede Log-Zeile. logging.pattern.level ist Spring
# Boots vorgesehener Einhängepunkt dafür: Der Wert wird in das mitgelieferte Konsolen-Pattern
# eingesetzt, statt es zu ersetzen — eine eigene logback-spring.xml müsste bei jedem
# Spring-Boot-Upgrade gegen das Default-Pattern gehalten werden.
# Ohne die %X{}-Platzhalter hier bleibt der MDC unsichtbar; LogPatternMdcTest sichert das ab.
# Gesetzt werden die Werte im LoggingContextFilter (requestId, jeder Request) und im
# JwtCookieAuthenticationFilter (userId, erst nach gültigem JWT) — "none" heisst also:
# vor der Filterkette entstanden bzw. nicht authentifiziert.
logging.pattern.level=%5p [req:%X{requestId:-none} user:%X{userId:-none}]
