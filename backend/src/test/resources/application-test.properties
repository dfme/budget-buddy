# Test-Profil. Die Datasource steht bewusst NICHT hier: sie zeigt auf den
# Testcontainers-Postgres und wird pro Testklasse dynamisch registriert
# (siehe com.budgetbuddy.support.PostgresTestDatabase, DB-05/ADR-12) — ein
# statischer Wert könnte den zufälligen Container-Port nicht kennen.

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Tests mit diesem Profil prüfen Web-/Security-Verhalten, nicht das Schema.
# Wer Tabellen braucht, schaltet Flyway über PostgresTestDatabase.register(...) ein.
spring.flyway.enabled=false

# PostgresTestDatabase.java teilt sich EINEN Testcontainers-Postgres (max_connections=100)
# über alle Testklassen. Jede Klasse bekommt via @DynamicPropertySource einen eigenen
# ApplicationContext (unterschiedliche Methodenreferenz = unterschiedlicher Cache-Key), und
# Spring haelt bis zu 32 Kontexte gleichzeitig im Cache (Default
# spring.test.context.cache.maxSize) - jeder mit einem eigenen HikariCP-Pool. Mit dem
# HikariCP-Default (maximumPoolSize=10, minimumIdle=maximumPoolSize) reichen schon rund zehn
# gleichzeitig gecachte Kontexte, um die 100 Verbindungen des Containers auszuschoepfen; ab
# dann haengt der naechste Kontextaufbau im HikariCP-connectionTimeout fest und der volle
# Lauf wirkt wie eingefroren, bis Spring den Kontext nach dem ersten Fehlschlag als dauerhaft
# gescheitert markiert ("ApplicationContext failure threshold exceeded"). Zwei Verbindungen
# je Kontext reichen für sequenzielle Tests bequem und halten den Bedarf selbst bei allen 32
# gecachten Kontexten unter dem Limit.
spring.datasource.hikari.maximum-pool-size=2
