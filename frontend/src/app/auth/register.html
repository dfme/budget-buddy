<section class="register">
  <h1>Registrieren</h1>

  <app-card>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <!-- Pflichtfelder zuerst (Review-Befund #230): die optionalen Namensfelder unten
           unterstreichen, dass sie übersprungen werden dürfen, statt den Blick beim Öffnen des
           Formulars auf Felder zu lenken, die gar nicht ausgefüllt werden müssen. -->
      <app-field label="E-Mail" inputId="email" [error]="emailError()">
        <input
          appInput
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          required
        />
      </app-field>

      <app-field label="Passwort" inputId="password" [error]="passwordError()">
        <input
          appInput
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          required
        />
      </app-field>

      <app-field label="Vorname (optional)" inputId="firstName">
        <input
          appInput
          id="firstName"
          type="text"
          formControlName="firstName"
          autocomplete="given-name"
        />
      </app-field>

      <app-field label="Nachname (optional)" inputId="lastName">
        <input
          appInput
          id="lastName"
          type="text"
          formControlName="lastName"
          autocomplete="family-name"
        />
      </app-field>

      @if (errorMessage(); as message) {
        <app-notice variant="error">{{ message }}</app-notice>
      }

      <button appButton block type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Konto wird angelegt…' : 'Konto erstellen' }}
      </button>
    </form>
  </app-card>

  <p class="login-hint">Schon ein Konto? <a routerLink="/login">Jetzt einloggen</a></p>
</section>
