<button
  type="button"
  class="bell"
  aria-label="Benachrichtigungen"
  [attr.aria-controls]="listId"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  <!-- Inline-SVG statt Emoji (FE-NOTIF-02, #308): 🔔 hat Emoji_Presentation=Yes, der
       Textselektor U+FE0E wird von vielen Fonts ignoriert und das Zeichen rendert farbig —
       damit lief es weder in Ink-Farbe noch mit Hover und Dark-Theme mit. Machart wie die
       Wortmarke in shell.html, nur schlankerer Strich, weil das Icon kleiner sitzt. -->
  <span class="bell__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none">
      <path
        d="M18 9a6 6 0 0 0-12 0c0 4.6-1.4 6-2.4 6.9-.5.4-.2 1.1.4 1.1h16c.6 0 .9-.7.4-1.1C19.4 15 18 13.6 18 9Z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linejoin="round"
      />
      <path
        d="M10 20a2.2 2.2 0 0 0 4 0"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </span>
  @if (unreadCount() > 0) {
    <span class="bell__badge">{{ unreadCount() }}</span>
  }
</button>

<!-- Disclosure, kein WAI-ARIA-Menu — gleiche Begründung wie beim Konto-Popover in Shell:
     role="menu" würde Pfeiltasten-Navigation versprechen, die es hier nicht gibt. -->
@if (open()) {
  <div class="bell-list" [id]="listId">
    <!-- FE-NOTIF-04: eine Aktion für alle ungelesenen — nur gerendert, solange es welche gibt.
         Ein dauerhaft sichtbarer, aber wirkungsloser Button wäre ein Versprechen ohne Inhalt. -->
    @if (unreadCount() > 0) {
      <div class="bell-list__actions">
        <button type="button" class="bell-list__read-all" (click)="markAllAsRead()">
          Alle als gelesen markieren
        </button>
      </div>
    }
    @if (notifications().length === 0) {
      <p class="bell-list__empty">Keine Benachrichtigungen</p>
    } @else {
      @for (notification of notifications(); track notification.id) {
        <button
          type="button"
          class="bell-list__item"
          [class.bell-list__item--unread]="!notification.read"
          [class.bell-list__item--read]="notification.read"
          (click)="select(notification)"
        >
          <span class="bell-list__message">{{ notification.message }}</span>
          <span class="bell-list__time">{{ notification.createdAt | date: 'short' }}</span>
        </button>
      }
    }
  </div>
}
