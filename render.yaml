# Render Blueprint — BudgetBuddy (INFRA-04)
# Deployt einen einzelnen Web Service: das Spring-Boot-JAR mit gebündelter
# Angular-SPA (ADR-10). Docker, weil Render-Blueprints keinen nativen
# Java-Runtime kennen; der Dockerfile-Build ruft `./mvnw -Pprod package` auf.
services:
  - type: web
    name: budgetbuddy
    runtime: docker
    # Frankfurt (EU) — nächster Render-Standort zur Schweiz, EU-DSGVO (ADR-10).
    region: frankfurt
    # Starter ($7/Mt, seit 09.08.2026 — Variante 8 aus ADR-5, umgesetzt in INFRA-24).
    # Gegenüber Free entfällt damit der Spin-Down nach 15 Minuten und der Deckel von
    # 750 Instanzstunden pro Monat, der bei ~720 h Bedarf praktisch keinen Puffer liess.
    #
    # Dieser Wert muss dem Plan im Render-Dashboard entsprechen: Wird das Blueprint mit
    # `plan: free` erneut angewendet, stuft es den laufenden Dienst zurück.
    #
    # Ein Persistent Disk wäre auf Starter buchbar, wird aber nicht genutzt — die Daten
    # liegen ausserhalb von Render in PostgreSQL bei Neon (Frankfurt/EU, ADR-12).
    plan: starter
    dockerfilePath: ./Dockerfile
    # Health-Check über die Actuator-Liveness-Probe (in application.properties aktiviert, in
    # SecurityConfig.PUBLIC_PATHS freigegeben). Bewusst nicht /actuator/health: dort hängt der
    # DataSourceHealthIndicator, dessen SELECT 1 bei jedem Ping Neons Scale-to-Zero aushebelt
    # und das Compute-Kontingent aufbraucht (INFRA-28).
    healthCheckPath: /actuator/health/liveness
    envVars:
      # Aktiviert application-prod.properties.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Secrets: NIE im Git. Werte ausschliesslich im Render-Dashboard setzen
      # (sync: false verhindert, dass Render einen Wert aus dem Blueprint erwartet).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Neon-Verbindung (ADR-12). Aufteilen des Connection-Strings und Anlegen des
      # Projekts: siehe docs/adr/ADR-12-datenpersistenz-produktion.md, Abschnitt "Setup".
      # Benutzer und Passwort gehören bewusst NICHT in die URL: eingebettet landen sie
      # in jeder Logzeile, die die Datasource-URL ausgibt.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
