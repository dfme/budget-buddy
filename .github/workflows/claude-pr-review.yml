name: Claude PR Review

# Automatisches Erst-Review via Claude Code GitHub Action (INFRA-31). Ruft denselben
# `/review-pr`-Skill auf, der auch lokal läuft — der liegt eingecheckt unter
# `.claude/skills/review-pr/` und ist nach dem Checkout im Workspace verfügbar.
#
# Das Review ist eine Ergänzung, kein Ersatz: die Freigabe durch mindestens einen Dev
# (CLAUDE.md → „Git: Review-Konvention") bleibt unberührt. Ein Action-Lauf ist kein Dev,
# und das Ruleset „protect main" erzwingt das ohnehin.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Minimal nach AC. `contents: read` genügt — der Review schreibt nie Code.
# `pull-requests: write` setzt das Review samt Inline-Threads ab, `issues: write` deckt
# Kommentare am verlinkten Issue ab, `id-token: write` die OIDC-Authentifizierung der Action.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest

    # Entwurfs-PRs bleiben aussen vor: `synchronize` feuert bei jedem Push, ein Draft
    # sammelt davon viele. Sobald er auf „Ready for review" geht, greift der
    # `ready_for_review`-Trigger und das Review läuft nach.
    if: github.event.pull_request.draft == false

    # Airbag gegen einen hängenden Lauf, nicht die erwartete Dauer. Ein Review liest den
    # Diff und führt Tests aus (Skill-Schritt 4) — das darf einige Minuten brauchen.
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 statt 1 — der Skill vergleicht in Schritt 3 gegen die Gegenseite und
      # ruft `git diff main`. Mit einem flachen Klon fehlt der Merge-Base und der Vergleich
      # schlägt fehl.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run /review-pr
        uses: anthropics/claude-code-action@v1
        with:
          # Beide Auth-Wege werden unterstützt, aber immer nur einer ist belegt: welcher der
          # beiden Inputs gewinnt, wenn beide gesetzt sind, ist nicht dokumentiert. Der
          # OAuth-Token (Pro/Max, lokal via `claude setup-token`) hat Vorrang; ist er nicht
          # hinterlegt, bleibt sein Input leer und der API-Key greift.
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Fortschritts-Kommentar am PR, solange der Review läuft. Ohne ihn ist zwischen
          # „läuft noch" und „ist stumm gescheitert" nichts zu unterscheiden.
          track_progress: true

          # Der Zusatz nach dem Skill-Aufruf ist kein Stilmittel, sondern behebt einen echten
          # Nichtdeterminismus: Schritt 7 des Skills verlangt eine Bestätigung vor dem Absetzen —
          # sinnvoll in der Sitzung, ohne Adressaten in CI. Am 26.08. liefen zwei Instanzen auf
          # demselben Commit von PR #212 (33021243731 und 33021327534); eine setzte das Review ab,
          # die andere wartet bis heute auf eine Freigabe, die nie kommt.
          #
          # Der Skill entscheidet inzwischen selbst anhand von `GITHUB_ACTIONS` (siehe dort,
          # Schritt 7 → «Ausnahme»). Diese Zeilen sind der Gürtel zum Hosenträger: sie stehen im
          # Prompt und damit im unmittelbaren Blickfeld, falls der Environment-Check einmal nicht
          # gelesen wird.
          prompt: |
            /review-pr ${{ github.event.pull_request.number }}

            Kontext: Dies ist ein nicht-interaktiver Lauf in GitHub Actions. Es gibt niemanden,
            der eine Rückfrage beantworten könnte — Schritt 7 (Bestätigung vor dem Absetzen)
            entfällt deshalb. Zeige die Befunde im Fortschritts-Kommentar und setze das Review
            direkt ab. Die harten Grenzen gelten unverändert: nicht approven, nicht mergen,
            fremde Threads nicht anfassen.

          # Bash ist per Default gesperrt. Ohne diese Freigabe kommt der Skill nicht weit:
          # er ruft `gh` (Issue und Ruleset lesen, Review absetzen), `git` (Diff gegen main)
          # und `python3` (Review-Payload als JSON, Skill-Schritt 8).
          #
          # `mcp__github_inline_comment__create_inline_comment` ist der Weg der Action, einen
          # Kommentar an eine Diff-Zeile zu hängen. Ohne ihn landen auch blockierende Befunde
          # nur im Fliesstext eines PR-Kommentars — und die Ruleset-Regel
          # `required_review_thread_resolution` sieht ausschliesslich Inline-Threads. Ein Review
          # ohne dieses Werkzeug kann den Merge also nicht aufhalten, was den Zweck von
          # `review-pr` verfehlt (INFRA-32; belegt an Lauf 33017262511).
          #
          # `--model` ist bewusst gesetzt, nicht dem Default überlassen: Die Action ist als `@v1`
          # eingebunden — ein beweglicher Tag. Ohne diese Zeile bestimmt Claude Code das Modell,
          # und eine künftige v1-Fassung könnte es still wechseln. Das Reviewverhalten änderte
          # sich dann, ohne dass sich eine Zeile im Repo ändert.
          #
          # Der Wert ist derselbe, den der Default zuletzt lieferte (Lauf 33019045344) — hier
          # also festgeschrieben, nicht gewechselt: Sonnet 5 hat in drei Läufen brauchbare
          # Reviews geliefert, inklusive Kreuzprobe gegen die Gegenseite und selbst ausgeführter
          # Testläufe. Ein stärkeres Modell bleibt eine Option, falls Befunde durchrutschen.
          #
          # Nur das Hauptmodell. Die Haiku-Stufe für interne Kleinaufgaben hängt an einem eigenen
          # Schalter (`ANTHROPIC_DEFAULT_HAIKU_MODEL`) und bleibt unberührt.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment"

      # Gürtel zum Hosenträger (INFRA-35): der Skill-Prompt sagt dem Agenten, dass er im
      # nicht-interaktiven Lauf synchron statt im Hintergrund verifizieren muss (SKILL.md
      # Schritt 4 → «Ausnahme») — aber ein Prompt-Text erzwingt kein Verhalten. Bei PR #223
      # (Lauf 33239595160) startete der Agent `./mvnw package` im Hintergrund und beendete die
      # Session danach, ohne das Ergebnis abzuwarten: kein Crash (`is_error: false`), aber auch
      # kein Review-Objekt für den Commit. Der Fortschritts-Kommentar hängt trotzdem ein
      # "Claude finished …"-Banner an, wodurch der stille Fehlschlag wie ein Erfolg aussieht.
      #
      # Dieser Schritt prüft deshalb unabhängig vom Agentenverhalten, ob für den Commit, der den
      # Lauf ausgelöst hat, tatsächlich ein Review-Objekt existiert, und macht das sichtbar, wenn
      # nicht — statt dass ein stiller Fehlschlag wie ein Erfolg aussieht.
      #
      # Absichtlich `::warning::` statt `::error::`/`exit 1`: dieser Check ist kein Required
      # Status Check im Ruleset „protect main" (nur `required_review_thread_resolution` und
      # `required_approving_review_count` sind es) und kann einen Merge folglich nie aufhalten.
      # Ein rotes, fehlgeschlagenes Ergebnis würde das Gegenteil suggerieren — genau das führte an
      # PR #223 zu Verwirrung, nachdem das fehlende Review von Hand nachgetragen war, der Lauf
      # aber weiterhin als `failure` stehen blieb. Eine Warnung bleibt sichtbar (Annotation in der
      # Run-Summary und als Warn-Badge neben dem Check in der PR-Checks-Liste), ohne die
      # Dringlichkeit eines echten Blockers vorzutäuschen.
      #
      # Die Meldung nennt drei bekannte Ursachen: (a) INFRA-35 selbst (Hintergrundbefehl ohne
      # Folge-Runde), (b) `claude-code-action` überspringt sich selbst, weil dieser PR
      # `claude-pr-review.yml` ändert (siehe `.claude/skills/README.md` → „Der Workflow läuft nie
      # auf dem PR, der ihn ändert") — beide ohne Handlungsbedarf —, und (c) der Agent hat seine
      # Analyse vollständig in den Fortschritts-Kommentar geschrieben, aber keinen tatsächlichen
      # Review-Aufruf abgesetzt (beobachtet an PR #223, Lauf 33247869625) — hier ist manuelles
      # Nachtragen nötig, siehe SKILL.md Schritt 8.
      - name: Verify a review was actually posted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          COUNT=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            --jq "[.[] | select(.commit_id == \"$HEAD_SHA\")] | length")
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::Kein Review-Objekt für Commit $HEAD_SHA gefunden. Drei bekannte Ursachen: (a) der Review-Agent hat die Session beendet, bevor er das Ergebnis eines Hintergrundbefehls abwarten konnte (INFRA-35) — kein Handeln nötig, wird beim nächsten Lauf erneut versucht; (b) dieser PR ändert claude-pr-review.yml selbst, wodurch claude-code-action sich laut eigener Validierung selbst überspringt (normal, kein Fehler — siehe .claude/skills/README.md -> 'Der Workflow läuft nie auf dem PR, der ihn ändert') — kein Handeln nötig, der Lauf funktioniert wieder ab dem nächsten PR nach dem Merge; (c) der Agent hat seine Analyse in den Fortschritts-Kommentar geschrieben, ohne ein Review-Objekt abzusetzen — hier fehlt tatsächlich ein Review, bitte manuell nachtragen oder einen neuen Lauf anstossen."
          else
            echo "Review-Objekt für Commit $HEAD_SHA gefunden ($COUNT)."
          fi
