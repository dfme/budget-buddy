<section class="fixed-cost-list">
  <h1>Budget</h1>

  <!--
    FE-FC-09: eingebetteter Abschnitt «Einkommen», unverändert aus settings.html übernommen
    (vormals FE-SET-03) — nur der Ort im UI hat sich geändert. Eigene Komponente statt inline,
    weil derselbe Abschnitt auch im Onboarding-Wizard eingebettet ist — kein dupliziertes
    Formular. Steht ganz oben: das Einkommen ist die Grundlage für die Warnung unterhalb
    («Fixkosten übersteigen Einkommen»). Nach dem Speichern lädt die Seite deshalb neu
    (`(saved)`), sonst zeigte die Warnung weiter das alte Einkommen.
  -->
  <app-income-card (saved)="fixedCosts.reload()" />

  <!--
    Zwischenüberschrift «Ausgaben» — gruppiert die beiden Unterabschnitte «Erfasste Fixkosten»
    und «Erkannte Abos» (je h3), analog «Einkommen» weiter oben.
  -->
  <h2>Ausgaben</h2>

  <!--
    Zwischenüberschrift «Erfasste Fixkosten» (FE-FC-07) als Gegenstück zu «Erkannte Abos» —
    erfasst von der Nutzerin, erkannt vom System. Seit FE-FC-13 eine eigene Komponente, die auch
    der Onboarding-Wizard einbettet: Tabelle, Bearbeiten, Löschen und der Dialog «Neue Position»
    (FE-FC-10) existieren damit nur einmal.
  -->
  <app-fixed-cost-section #fixedCosts heading="Erfasste Fixkosten" [headingLevel]="3" />

  <!--
    FE-FC-05: Erkannte Abos (US-08) stehen seit der Zusammenführung hier, unter der
    Fixkosten-Tabelle — nicht mehr auf einer eigenen Seite. Eigener Lade- und Fehlerzustand: ein
    Fehler in der Abo-Liste lässt die Fixkosten-Tabelle stehen und umgekehrt.
  -->
  <app-recurring-expense-list />
</section>
