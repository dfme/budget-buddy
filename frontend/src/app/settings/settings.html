<section class="settings">
  <h1>Einstellungen</h1>

  <app-card title="Passwort" />

  <app-card title="Einkommen">
    <form [formGroup]="incomeForm" (ngSubmit)="submitIncome()" novalidate>
      <app-field label="Monatseinkommen (CHF)" inputId="monthlyIncome" [error]="incomeError()">
        <input
          appInput
          id="monthlyIncome"
          type="number"
          formControlName="betrag"
          inputmode="decimal"
          min="0.01"
          step="0.01"
        />
      </app-field>

      @if (incomeSuggestionText(); as suggestion) {
        <div class="income-suggestion">
          <app-notice variant="info">{{ suggestion }}</app-notice>
          <button
            appButton
            variant="ghost"
            type="button"
            class="income-suggestion__apply"
            [disabled]="incomeSubmitting()"
            (click)="applyIncomeSuggestion()"
          >
            {{ incomeSubmitting() ? 'Wird übernommen…' : 'Übernehmen' }}
          </button>
        </div>
      }

      @if (incomeErrorMessage(); as message) {
        <app-notice variant="error">{{ message }}</app-notice>
      }
      @if (incomeSaved()) {
        <app-notice variant="info">Einkommen gespeichert.</app-notice>
      }

      <button
        appButton
        block
        type="submit"
        [disabled]="
          incomeForm.invalid || incomeSubmitting() || incomeForm.controls.betrag.value === null
        "
      >
        {{ incomeSubmitting() ? 'Wird gespeichert…' : 'Einkommen speichern' }}
      </button>
    </form>
  </app-card>

  <app-card title="Erscheinungsbild">
    <app-segment
      ariaLabel="Erscheinungsbild"
      [options]="themeOptions"
      [value]="theme.preference()"
      (valueChange)="selectTheme($event)"
    />
    <p class="settings__hint">
      „System" folgt der Einstellung deines Geräts. Die Wahl gilt nur in diesem Browser.
    </p>
  </app-card>
</section>
