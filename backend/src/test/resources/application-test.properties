# Test-Profil. Die Datasource steht bewusst NICHT hier: sie zeigt auf den
# Testcontainers-Postgres und wird pro Testklasse dynamisch registriert
# (siehe com.budgetbuddy.support.PostgresTestDatabase, DB-05/ADR-12) — ein
# statischer Wert könnte den zufälligen Container-Port nicht kennen.

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Tests mit diesem Profil prüfen Web-/Security-Verhalten, nicht das Schema.
# Wer Tabellen braucht, schaltet Flyway über PostgresTestDatabase.register(...) ein.
spring.flyway.enabled=false
