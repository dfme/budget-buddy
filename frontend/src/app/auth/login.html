<section class="login">
  <h1>Login</h1>

  <app-card>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-field label="E-Mail" inputId="email" [error]="emailError()">
        <input appInput id="email" type="email" formControlName="email" autocomplete="email" required />
      </app-field>

      <app-field label="Passwort" inputId="password" [error]="passwordError()">
        <input
          appInput
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          required
        />
      </app-field>

      @if (errorMessage(); as message) {
        <app-notice>{{ message }}</app-notice>
      }

      <button appButton block type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Wird eingeloggt…' : 'Einloggen' }}
      </button>
    </form>
  </app-card>

  <p class="register-hint">Noch kein Konto? <a routerLink="/register">Jetzt registrieren</a></p>
</section>
